version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Bogota }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      testing:
        patterns: ["org.junit*", "org.assertj*", "org.testcontainers*", "com.tngtech.archunit*", "org.mockito*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Bogota }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly, day: monday, timezone: America/Bogota }
    ignore:
      # El proyecto compila con toolchain Java 21 (LTS); subir de versión mayor es decisión manual.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
