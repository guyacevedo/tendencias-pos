# Tema de Tendencias POS sobre FlatLaf (sintaxis de propiedades de FlatLaf).
# Las claves con prefijo [light] o [dark] solo aplican en ese modo; Theme filtra el prefijo.
# Colores de marca provisionales: cambiar aquí cuando la tienda defina su identidad visual.

[light]@accentColor = #C2410C
[dark]@accentColor = #FB923C

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
Component.focusWidth = 1
ScrollBar.showButtons = false
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
TitlePane.unifiedBackground = true

# Colores propios de la aplicación (prefijo Tpos.)
[light]Tpos.sidebarBackground = #F4F4F5
[dark]Tpos.sidebarBackground = #1E1F22
[light]Tpos.dangerColor = #B91C1C
[dark]Tpos.dangerColor = #DC2626
[light]Tpos.successColor = #15803D
[dark]Tpos.successColor = #16A34A
[light]Tpos.infoColor = #1D4ED8
[dark]Tpos.infoColor = #2563EB
Tpos.onStatusColor = #FFFFFF
