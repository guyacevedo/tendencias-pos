[versions]
java = "21"
spring-boot = "4.1.1"
springdoc = "3.1.1"
flatlaf = "3.7.2"
miglayout = "11.5.1"
ikonli = "12.4.0"
zxing = "3.5.4"
jasperreports = "7.0.8"
jackson = "3.2.3"
archunit = "1.5.1"
testcontainers = "2.0.5"
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.24.0"
palantir-format = "2.102.0"
spotless = "8.10.3"

[libraries]
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
miglayout-swing = { module = "com.miglayout:miglayout-swing", version.ref = "miglayout" }
ikonli-swing = { module = "org.kordamp.ikonli:ikonli-swing", version.ref = "ikonli" }
ikonli-mdi2 = { module = "org.kordamp.ikonli:ikonli-materialdesign2-pack", version.ref = "ikonli" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }
jasperreports = { module = "net.sf.jasperreports:jasperreports", version.ref = "jasperreports" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
