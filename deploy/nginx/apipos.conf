# /etc/nginx/sites-available/apipos.conf — API de Tendencias POS detrás del Nginx existente.
# Certificado: ver docs/deploy.md (certbot con webroot /var/www/certbot).

server {
    listen 80;
    listen [::]:80;
    server_name apipos.comercializadora-neymar.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apipos.comercializadora-neymar.com;

    ssl_certificate     /etc/letsencrypt/live/apipos.comercializadora-neymar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apipos.comercializadora-neymar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:apipos_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    # Cabeceras de seguridad (solo API JSON, nada se renderiza en navegador).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Actuator solo para el healthcheck interno de Docker.
    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
