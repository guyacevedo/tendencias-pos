# Base de datos para desarrollo local: docker compose -f deploy/compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tpos
      POSTGRES_USER: tpos
      POSTGRES_PASSWORD: tpos_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tpos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpos -d tpos"]
      interval: 5s
      retries: 10
volumes:
  tpos-pgdata:
