# Producción: todo llega por variables de entorno; si falta una, la app no arranca.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
server:
  # Detrás de Nginx: respetar X-Forwarded-* (esquema https, IP real del cliente).
  forward-headers-strategy: native
